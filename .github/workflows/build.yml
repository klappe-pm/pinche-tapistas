name: Rebuild site
# Whenever the scores (data/) or the page source (src/, build.py) change, rebuild index.html and commit it.
on:
  push:
    branches: [main]
    paths: ['data/**', 'src/**', 'vendor/**', 'build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Commit rebuilt page
        run: |
          if git diff --quiet -- index.html; then echo "index.html already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from latest data"
          git push
